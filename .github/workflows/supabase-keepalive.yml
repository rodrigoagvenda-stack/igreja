name: Supabase keepalive

on:
  schedule:
    - cron: "0 9 * * *" # todo dia, 9h UTC — evita o projeto pausar por inatividade (limite free é 7 dias)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve no banco pra manter o projeto ativo
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/arq_paroquias?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
